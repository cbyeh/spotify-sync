# Each [[sync]] block is one "applet".
#
#   from = "liked"                  -> your Liked Songs
#   from = "recent"                 -> your recently played tracks
#   from = "<playlist link/ID>"     -> a playlist you own or collaborate on
#   to   = "<playlist link/ID>"     -> the playlist to write into (must be yours)
#
# Playlist links: in Spotify, ... > Share > Copy link to playlist.
# Or run `python spotify_sync.py playlists` to list IDs.
#
# Optional per job:
#   backfill = true    (liked) copy your whole Liked Songs history, not just new likes
#   mode = "rolling"   (recent) playlist of your last `keep` distinct tracks, newest first (default keep = 100)
#   mode = "archive"   (recent) every distinct track you play, added once and kept forever
#   enabled  = false   skip this job

[[sync]]
name = "Liked Songs backup"
from = "liked"
to   = "1k6vxCv3Z389o9QK2qaxD7"   # Liked songs backUP
backfill = false

[[sync]]
name = "Recently played"
from = "recent"
to   = "5PDaSAK5sFZWzN6yPz5bXN"   # Recently Played
mode = "rolling"
keep = 100

# Example: a permanent listening history. Make an empty playlist, paste its link, uncomment.
# [[sync]]
# name = "Listening archive"
# from = "recent"
# to   = "PASTE_ARCHIVE_PLAYLIST_LINK_HERE"
