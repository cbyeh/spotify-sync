# Each [[sync]] block is one "applet".
#
#   from = "liked"                  -> your Liked Songs
#   from = "recent"                 -> your recently played tracks
#   from = "<playlist link/ID>"     -> a playlist you own or collaborate on
#   to   = "<playlist link/ID>"     -> the playlist to write into (must be yours)
#
# Playlist links: in Spotify, ... > Share > Copy link to playlist.
# Or run `python spotify_sync.py playlists` to list IDs.
#
# Optional per job:
#   backfill = true    (liked) copy your whole Liked Songs history, not just new likes
#   mode = "rolling"   (recent) playlist of your last `keep` distinct tracks, newest first (default keep = 100)
#   mode = "archive"   (recent) every distinct track you play, added once and kept forever
#   only_from = "<playlist link/ID>"   (recent) only plays whose source was that playlist, e.g. Discover Weekly
#   via = "playback"   read a playlist the API won't give us (Discover Weekly) by briefly playing it,
#                      muted, on an idle Spotify desktop app; weekly; restores your player afterwards
#   device = "<name>"  (playback) use this Spotify device instead of any computer
#   enabled  = false   skip this job

[[sync]]
name = "Liked Songs backup"
from = "liked"
to   = "1k6vxCv3Z389o9QK2qaxD7"   # Liked songs backUP
backfill = false

[[sync]]
name = "Recently played"
from = "recent"
to   = "5PDaSAK5sFZWzN6yPz5bXN"   # Recently Played
mode = "rolling"
keep = 100

# Permanent listening history: every song you finish, added once, kept forever.
[[sync]]
name = "Recently played forever"
from = "recent"
to   = "6JqJYMSccCzSFTB0XMFGXZ"   # Recently played forever
mode = "archive"

# Every Discover Weekly song you listen to (to the end) goes into All Weeklies.
# Spotify won't let personal apps read Discover Weekly itself, but your listening history
# records which playlist each song was played from. Songs you don't play aren't captured.
[[sync]]
name = "Discover Weekly -> All Weeklies"
from = "recent"
only_from = "37i9dQZEVXcFznARRTnOdi"   # your Discover Weekly (Share > Copy link to playlist)
to   = "41JXOe9PZ9g6v2PUW687l6"        # All Weeklies
mode = "archive"

# The FULL Discover Weekly list, including songs you never play. Opt-in: every Monday from 4 AM
# (Pacific) it briefly plays Discover Weekly, muted, on an idle Spotify desktop app to read it,
# then restores shuffle, repeat, volume and what you had loaded. Needs the desktop app open.
[[sync]]
name = "Discover Weekly full list -> All Weeklies"
from = "37i9dQZEVXcFznARRTnOdi"        # your Discover Weekly
to   = "41JXOe9PZ9g6v2PUW687l6"        # All Weeklies
via  = "playback"
